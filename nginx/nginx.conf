# Nigeria Lex — Nginx reverse proxy
# Terminates TLS and proxies everything to the Next.js/Payload app container.
# Replace nigerialex.com with the real production domain before deploying.

server {
    listen 80;
    server_name nigerialex.com www.nigerialex.com;

    # Let's Encrypt HTTP-01 challenge path (used by the certbot container).
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect everything else to HTTPS once a certificate exists.
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name nigerialex.com www.nigerialex.com;

    ssl_certificate     /etc/letsencrypt/live/nigerialex.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nigerialex.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    client_max_body_size 20m; # allow PDF / logo uploads through the proxy

    location / {
        proxy_pass http://app:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
